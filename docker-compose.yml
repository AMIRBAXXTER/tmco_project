services:
  backend:
    container_name: backend
    build: ./backend
    command: sh /code/entrypoint.sh
    volumes:
      - ./backend:/code
      - ./backend/static:/vol/web/static
      - ./backend/media:/vol/web/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - main

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    restart: always
    networks:
      - main
    # for dev stage only
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    # command: npm run dev

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/vol/web/static
      - ./backend/media:/vol/web/media
    depends_on:
      - backend
      - frontend
    networks:
      - main

  db:
    container_name: db
    image: postgres:13-alpine
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - main

  redis:
    image: redis:7.0.11-alpine
    container_name: redis
    command: >
      sh -c 'redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru'
    ports:
      - "6379:6379"  # در پروداکشن بردار
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - main


  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - main

