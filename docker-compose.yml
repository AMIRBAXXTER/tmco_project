services:
  backend:
    container_name: backend

#    for dev stage only
#    build: ./backend
#    command: sh /code/entrypoint.sh

#    for prod stage only
    image: ghcr.io/amirbaxxter/tmco-backend:latest

    volumes:
#    for dev stage only
#      - ./backend:/code
      - static_data:/code/static
      - media_data:/code/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - PHASE_ENV=production
#      - PHASE_ENV=development
      - POSTGRES_DB=tmco_project_db
      - POSTGRES_USER=tmco_project_user
      - POSTGRES_PASSWORD=A$%^12Hhdk*V185Ui%32vbOTt&&25
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    networks:
      - main

  frontend:
    container_name: frontend
    ports:
      - "3000:3000"
    restart: always
    networks:
      - main

    # for prod stage only
    image: ghcr.io/amirbaxxter/tmco-frontend:latest

    # for dev stage only
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile.dev
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    # command: npm run dev

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/code/static
      - media_data:/code/media
    depends_on:
      - backend
      - frontend
    networks:
      - main

  db:
    container_name: db
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=tmco_project_db
      - POSTGRES_USER=tmco_project_user
      - POSTGRES_PASSWORD=A$%^12Hhdk*V185Ui%32vbOTt&&25
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main

  redis:
    image: redis:7.0.11-alpine
    container_name: redis
    command: >
      sh -c 'redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru'
    ports:
      - "6379:6379"  # در پروداکشن بردار
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - main


  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - main

#  celery:
#    container_name: celery
#    build: ./backend
#    command: celery -A config.celery_base worker -Q send_otp,send_reset_link,main -l info
#    volumes:
#      - ./backend:/code
#    env_file:
#      - env.env
#    depends_on:
#      - backend
#      - db
#      - redis
#      - rabbitmq
#    networks:
#      - main
#
#  celerybeat:
#    container_name: celerybeat
#    build: ./backend
#    command: celery -A config.celery_base beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
